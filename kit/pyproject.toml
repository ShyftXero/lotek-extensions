[project]
name = "lotek-kit"
description = "Shared contract library for the lotek platform: the attackpath/v1 document model and the one reorder implementation. NOT an extension — it never mounts, and it never imports lotek."
readme = "README.md"
requires-python = ">=3.14"

# Deliberately EMPTY, and pinned by a test. Core takes this as a BASE dependency, so anything the kit
# depends on becomes a dependency of lotek itself and of every extension that consumes the kit.
dependencies = []

# `dynamic` because this repo's release discipline derives versions from the git build id rather than a
# hand-typed literal. See hatch_build.py.
dynamic = ["version"]

[project.optional-dependencies]
# Only for the Flask asset blueprint (lotek_kit.flask_assets), which imports flask INSIDE the function.
# A consumer that only wants the attackpath model must not be made to install a web framework.
flask = ["flask>=3.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyrefly>=0.16.0",
    # hatch_build.py subclasses MetadataHookInterface, so importing it to test the version hook needs
    # the build backend present at TEST time too. It stays out of [build-system] duty here — this is
    # only so tests/test_build_id_parity.py can load the module at all.
    "hatchling>=1.24",
]

# NOTE: there is deliberately no [project.entry-points."lotek.extensions"] table and no
# lotek-extension.toml. lotek's discovery enumerates exactly that entry-point group
# (src/app/extensions.py:361,418), so their absence is what makes this package structurally
# unmountable — it cannot become an extension by accident. A test pins this.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `static/` lives INSIDE lotek_kit/, so it ships as ordinary package data with NO force-include. That
# matters: CLAUDE.md documents a trap where an editable path install skips the wheel build and a
# force-included file is silently absent at runtime. Nothing here is force-included, so nothing can go
# missing that way.
packages = ["lotek_kit"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

{% extends "fraction/base.html" %}
{% block title %}Checklists — Fraction{% endblock %}
{% block appbar_title %}Checklists{% endblock %}
{% block content %}
<section class="cklib" id="checklist-library"
         data-templates-url="{{ url_for('fraction_api.list_checklist_templates') }}">
  <div class="cklib-head">
    <button type="button" class="btn" id="cklib-new">+ New / Import</button>
    <label class="cklib-showhidden"><input type="checkbox" id="cklib-hidden"/> show hidden</label>
  </div>

  <div id="cklib-form" class="cklib-form card" hidden>
    <div class="cklib-form-row">
      <input type="text" id="cklib-name" placeholder="Name (optional if given in the source)"/>
      <select id="cklib-kind">
        <option value="coverage">coverage</option>
        <option value="reminder">reminder</option>
        <option value="compliance">compliance</option>
      </select>
      <select id="cklib-fmt">
        <option value="markdown">Markdown</option>
        <option value="json">JSON</option>
      </select>
    </div>
    <textarea id="cklib-src" rows="10"
      placeholder="# Title&#10;&#10;## Section&#10;- [ ] **Item**: guidance"></textarea>
    <div class="cklib-form-actions">
      <button type="button" class="btn" id="cklib-save">Create</button>
      <button type="button" class="btn ghost" id="cklib-cancel">Cancel</button>
      <span class="cklib-err" id="cklib-err"></span>
    </div>
  </div>

  <div id="cklib-list"><p class="muted">Loading…</p></div>
</section>
<script src="{{ url_for('fraction.static', filename='checklists_library.js') }}"></script>
{% endblock %}

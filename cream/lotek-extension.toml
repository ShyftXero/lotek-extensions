# How this extension MOUNTS into a host (lotek). These are the values lotek's
# scripts/stage-extension.sh currently GENERATES into its own [extension] table (passed as CLI args at
# vendor time). Carried here so an INSTALLED package (pinned git dep) is self-describing: the host can
# read its mount metadata straight from the shipped manifest instead of the operator re-supplying
# entrypoint/url_prefix/seed. Named [mount], NOT [extension], on purpose — the staging script still
# emits its own [extension] table before appending this file, and TOML forbids a duplicate table, so
# an [extension] header here would make tomllib raise and silently un-discover the whole extension.
[mount]
name = "cream"
entrypoint = "cream"          # importable module exposing register(...)
url_prefix = "/cream"
seed = "cream.seed:seed_defaults"   # module:callable run once after register() (idempotent)

# What CREAM exposes to a host (lotek). Consumed at vendor time by scripts/stage-extension.sh and
# appended verbatim to the generated extensions/cream/extension.toml, so the host renders exactly the
# sidebar entries declared here. `path` is relative to the extension's url_prefix.
[[nav]]
label = "CREAM"
path = "/"
icon = "$"

[[nav]]
label = "CREAM branding"
path = "/brand"
icon = "*"

# How this extension plugs into generic HOST surfaces. A NEW top-level table on purpose: the staging
# script already emits its own [extension] table before appending this file, and TOML forbids a
# duplicate table — an [extension] header here would make tomllib raise and silently un-discover the
# whole extension.
[host]
# Path (relative to url_prefix) of this extension's PAT/Bearer MACHINE api. The host treats it as a
# machine surface: skipped by the cookie/session dashboard gate and CSRF-exempt, exactly like
# lotek's own /api/v1. MUST be a proper sub-path of url_prefix, and MUST NOT overlap the
# cookie-authed browser JSON api at <url_prefix>/api.
machine_prefix = "/machine"

# Operator doc for the host Docs page. Optional — omitted, the host looks for docs/<NAME>.md.
docs = "docs/CREAM.md"
docs_title = "CREAM (quoting & invoicing)"

# Tables this extension OWNS: the host may carry them through a migration, attribute them for
# drop/truncate, and never touch a table nobody claims. tests/test_extension_schema.py requires this.
[db]
base = "cream.models:Base"   # the module whose IMPORT registers the tables
table_prefix = "cream_"

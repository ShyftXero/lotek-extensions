[project]
name = "scribble"
version = "0.1.0.dev0"
description = "Pentest vulnerability database + reporting engine (FACTION-inspired), mountable into Lotek."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0.0",
    "flask-wtf>=1.2.0",
    "flask-socketio>=5.3.0",
    "sqlalchemy>=2.0.0",
    # Scribble owns its OWN migration history, in its OWN version table
    # (`scribble_alembic_version`), inside the host's database. Not optional: `run_migrations` is the
    # only path that creates or upgrades scribble's schema since lotek#335.
    "alembic>=1.13.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
    "nh3>=0.2.0",
    "docxtpl>=0.16.0",
    "python-docx>=1.1.0",
    "loguru>=0.7.0",
    # Phase B live co-editing (WS11). Core, not optional: the collab routes are wired into the app
    # factory, so a build without these would ImportError at startup despite an "optional" label.
    "pycrdt>=0.9.0",
    "flask-sock>=0.7.0",
    # scribble.api_schemas declares the machine API's request bodies as pydantic models; the host's
    # OpenAPI generator hoists them into components.schemas so the spec documents real types.
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.6.0",
    "pyrefly>=0.16.0",
]

# Discovery signal: lotek enumerates installed extensions via this entry-point group
# (importlib.metadata.entry_points(group="lotek.extensions")). The value is the entrypoint MODULE that
# exposes register(...); ep.name is the slug and ep.load() imports that module.
[project.entry-points."lotek.extensions"]
scribble = "scribble"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribble"]

# Ship lotek-extension.toml INSIDE the wheel's package dir so the host can read the mount/nav/host/db
# manifest from the installed package via
# importlib.resources.files("scribble").joinpath("lotek-extension.toml"). The manifest lives at the
# project root (where lotek's vendoring consumes it verbatim); force-include copies it under the
# package dir in the built wheel without moving or duplicating the source file in the repo.
[tool.hatch.build.targets.wheel.force-include]
"lotek-extension.toml" = "scribble/lotek-extension.toml"
# Same trick for the operator doc the manifest's [host] docs key points at, so lotek's in-app Docs page
# can render it straight out of the installed package (importlib.resources) rather than needing a repo
# checkout. Source stays at docs/SCRIBBLE.md so it also renders on GitHub.
"docs/SCRIBBLE.md" = "scribble/docs/SCRIBBLE.md"

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[project]
name = "scribble"
version = "0.1.0.dev0"
description = "Pentest vulnerability database + reporting engine (FACTION-inspired), mountable into Lotek."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-wtf>=1.2.0",
    "flask-socketio>=5.3.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
    "nh3>=0.2.0",
    "docxtpl>=0.16.0",
    "python-docx>=1.1.0",
    "loguru>=0.7.0",
    # Phase B live co-editing (WS11). Core, not optional: the collab routes are wired into the app
    # factory, so a build without these would ImportError at startup despite an "optional" label.
    "pycrdt>=0.9.0",
    "flask-sock>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.6.0",
    "pyrefly>=0.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribble"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

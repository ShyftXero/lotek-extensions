# Alembic config for Scribble's OWN schema.
#
# There is deliberately NO `sqlalchemy.url` here. Scribble is mounted into a host and handed that
# host's engine at register() time, so the target database is not knowable from this file. The runner
# (`scribble.db.run_migrations`) passes the live connection in via `config.attributes["connection"]`,
# and `migrations/env.py` refuses offline (--sql) mode outright rather than generate SQL for a database
# it cannot identify.
#
# To autogenerate a revision against a scratch database, pass the URL on the command line:
#   cd scribble && uv run --extra dev alembic -x url=postgresql+psycopg://... revision --autogenerate -m "..."

[alembic]
script_location = scribble/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

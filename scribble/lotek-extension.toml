# How this extension MOUNTS into a host (lotek). Carried in the wheel so an INSTALLED package (a pinned
# git dep — see README "How lotek consumes these") is self-describing: lotek reads this manifest straight
# from the shipped wheel via importlib.resources (src/app/extensions.py) instead of the operator
# re-supplying entrypoint/url_prefix/seed. Table is [mount] (the host contract's name for it).
[mount]
name = "scribble"
entrypoint = "scribble"          # importable module exposing register(...)
url_prefix = "/scribble"
seed = "scribble.seed:seed_defaults"   # module:callable run once after register() (idempotent)

# What Scribble exposes to a host (e.g. lotek) beyond the basics. Read from the wheel-shipped manifest at
# discovery time (importlib.resources), so the host renders exactly the sidebar entries the extension
# declares here. `path` is relative to the extension's url_prefix; `icon` is an optional glyph. Order
# here is the sidebar order.
[[nav]]
label = "Scribble"
path = "/"
icon = "◈"

[[nav]]
label = "Report Boards"
path = "/engagements"
icon = "◆"

[[nav]]
label = "Vuln Library"
path = "/library"
icon = "▤"

[[nav]]
label = "Assessment Types"
path = "/assessment-types"
icon = "⚙"

# Report Themes (ext#113). Deliberately IS a sidebar entry rather than a link buried in the report
# toolbar: the page manages install-wide appearance (upload an override Theme, pick the default every
# report inherits), which is administration, not something you reach from inside one engagement's
# report. The routes behind it are admin-gated regardless of who can see the link.
[[nav]]
label = "Report Themes"
path = "/themes"
icon = "◐"

# What this Scribble checkout supports, for a host that FEATURE-DETECTS instead of hard-assuming
# (lotek: app.extensions.extension_supports). Declaring this table makes it AUTHORITATIVE — the host
# stops introspecting the mounted model class and trusts exactly what's listed here. Keep in sync with
# scribble/models.py: only list a field once its column actually exists on the named model, and only
# list a feature once the behavior it names is actually implemented.
[capabilities]
# Optional columns on scribble.models.Engagement beyond the always-present base schema.
engagement_fields = ["owner_id"]
# Optional columns on scribble.models.EngagementFinding beyond the always-present base schema.
finding_fields = ["source_finding_id", "parent_id", "target_host", "template_id"]
# Behaviors (not tied to one column) a host can conditionally build on.
features = ["nested_findings", "vuln_template"]

# How this extension plugs into generic HOST surfaces. A NEW top-level table on purpose: the staging
# script already emits its own [extension] table before appending this file, and TOML forbids a
# duplicate table — an [extension] header here would make tomllib raise and silently un-discover the
# whole extension.
[host]
# Path (relative to url_prefix) of this extension's PAT/Bearer MACHINE api. The host treats it as a
# machine surface: skipped by the cookie/session dashboard gate and CSRF-exempt, exactly like
# lotek's own /api/v1. MUST be a proper sub-path of url_prefix, and MUST NOT overlap the
# cookie-authed browser JSON api at <url_prefix>/api.
machine_prefix = "/machine"
# Table in the shared DB whose rows soft-reference a host Client (client_id). The host's client-delete
# guard counts these generically so deleting a client can't orphan them.
client_ref_table = "scribble_engagements"
client_ref_label = "engagement"
# Operator doc for the host Docs page. Optional — omitted, the host looks for docs/<NAME>.md.
docs = "docs/SCRIBBLE.md"
docs_title = "Scribble (reporting)"

# Tables this extension OWNS, for a host that manages extension schema (lotek: app/extension_schema.py).
# `base` is a declarative Base — the authoritative table list AND real DDL, used only while this extension
# is ENABLED (importing it runs its module code, so a disabled extension is never imported). `table_prefix`
# is the attribution fallback for when this code is NOT importable (disabled/uninstalled), which is exactly
# the state a host cleans up in. A host that does not manage schema ignores this table.
[db]
base = "scribble.models:Base"   # the module whose IMPORT registers the tables (db.py alone yields an empty Base)
table_prefix = "scribble_"

# The registered audit-verb vocabulary (INV-AUDIT-03's reader half, ext#57). Bare verbs — the host
# namespaces each to `ext:scribble:<verb>` (see app.extensions.extension_audit_actions) and merges
# them into /admin/audit's action filter. Keep this list in sync with what api_pat.py's `_audit(db,
# "<verb>", ...)` calls actually emit: a verb declared here that nothing emits is a false promise in
# the dropdown, and an emitted verb missing here is silent again (the exact gap ext#57 closes).
[audit]
verbs = [
    "create_engagement",
    "create_template",
    "add_finding",
    "create_vuln_map",
    "report_read",
    "update_finding",
    "delete_finding",
    "move_finding",
    "move_findings",
    "create_group",
    "update_group",
    "delete_group",
    "reorder_groups",
    "upload_artifact",
    "update_artifact",
    "link_attack_path",
    "update_attack_path",
    "delete_attack_path",
    # Report Themes (ext#113). Emitted by themes_api.py -- which is WHY the guard in
    # tests/test_machine_openapi.py now scans the whole package instead of api_pat.py alone: these four
    # were emitted and undeclared while that test stayed green, because it could not see a second file.
    "create_override_theme",
    "update_override_theme",
    "delete_override_theme",
    "set_default_theme",
]

# Scribble report Theme — Dark.
#
# REFACTOR, not a redesign: every value in [tokens] below was copied verbatim out of the
# `:root[data-theme="dark"] { }` block of `reporting/render_html.py`'s `_CSS` string (#102) — the same
# values the `prefers-color-scheme: dark` media block sets for the `auto` stamp, so this Theme also
# matches what an unstamped report already looks like on a dark-mode viewer today.
# `tests/test_report_theme_files.py` re-parses that stylesheet and asserts this file never drifts from
# it. `radius`/`measure`/`maxw` are NOT overridden by the dark block in `_CSS` — they carry the same
# value as `light.toml` here because that IS the effective value under the dark stamp (inherited from
# `:root`), not an oversight. See `report_themes/README.md` for the full schema this file follows.

[identity]
name = "dark"
label = "Dark"
# Which palette these values are tuned for. Matches this Theme's entry in `reporting/themes.py`'s
# registry; a test asserts the two agree, so the file and the registry cannot drift.
stamp = "dark"

[tokens]
bg = "#0b1016"
surface = "#131c25"
surface-2 = "#0e161e"
ink = "#e7eef5"
ink-2 = "#b6c4d2"
muted = "#8698a8"
line = "#23303d"
line-2 = "#35485b"
accent = "#2bb283"
accent-ink = "#7ee0bc"
accent-wash = "#0f2a20"
sev-critical = "#ef5a4f"
sev-high = "#ef8a44"
sev-medium = "#d9a63e"
sev-low = "#56a6da"
sev-info = "#93a3b4"
radius = "8px"
measure = "72ch"
maxw = "1080px"

# Type stacks. Identical in both bundled Themes: `_CSS` declares these once in `:root` and never
# re-themes them per palette, so the effective value is the same light or dark. They exist as tokens
# so a BRAND Theme can replace them; the shipped values are the system stacks.
font-body = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
font-display = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
font-mono = 'ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace'

# No custom web fonts today — see light.toml's [fonts] comment; the same reasoning applies here.
[fonts]
embed = false

# Reserved for #104 (logo/shape assets). Intentionally empty — see `reporting/theme_files.py`.
[marks]

name     = "Weak or Guessable Credentials"
category = "Credential Access"
severity = "high"

description = """
<p>Credential testing (targeted brute force or password spraying) against in-scope network service(s) confirmed that one or more accounts accept a weak, default, or otherwise guessable password.</p>
"""

impact = """
<p>This is direct authenticated access as the affected account. How far it goes depends on that account's rights and group memberships: a low-privilege user is a foothold, a privileged one is closer to game over. A single weak credential is often the one thing a well-hardened environment is missing, which is what makes it worth testing for.</p>
"""

replication = """
<ul><li>Credential testing against the identified service(s) confirmed the account(s) below authenticate with the tested password: {{AFFECTED}}</li></ul>
"""

remediation = """
<p>Reset every affected credential to a strong, unique value, enforce a solid password policy (length over complexity, plus breached-password screening), and require MFA anywhere the service supports it. Remove or rotate default and installer accounts instead of leaving them at their shipped password. For detection, watch for spray patterns: many failed logons (Event ID 4625) across many accounts from one source in a short window, rather than repeated attempts against a single account.</p>
<p><strong>References</strong></p><ul><li>MITRE ATT&amp;CK T1110: Brute Force</li><li>CWE-521: Weak Password Requirements</li><li>NIST SP 800-63B: Digital Identity Guidelines</li></ul>
"""

name     = "DCSync - Domain Credential Database Extraction"
category = "Active Directory - Credential Access"
severity = "critical"

description = """
<p>An account with directory-replication rights ran a DCSync (DRSUAPI replication) against a domain controller and pulled NTLM hashes out of the NTDS.dit database, which is the credential store for the whole domain. Holding and using <em>Replicating Directory Changes</em> and <em>Replicating Directory Changes All</em> is Domain-Admin-equivalent, whatever groups the account is nominally in.</p>
"""

impact = """
<p>This is full domain compromise. Every account's hash is available for pass-the-hash and offline cracking, and the <code>krbtgt</code> hash specifically lets an attacker forge Golden Tickets for domain persistence that outlives ordinary password resets. Once someone holds the credential database, there is nothing further in the domain to escalate to.</p>
"""

replication = """
<ul><li>Replicate the credential database remotely: <code>secretsdump.py {{DOMAIN}}/da:pass@{{TARGET_HOST}} -just-dc</code></li></ul>
<p>Scope of extraction: {{AFFECTED}}</p>
"""

remediation = """
<p>Treat the domain as compromised. Rotate all credentials, reset the <code>krbtgt</code> password twice (letting AD replication finish between resets), and rebuild trust from a known-good state rather than assuming one account cleanup covers it. Restrict <em>Replicating Directory Changes</em> and <em>...All</em> to Domain Controllers only, and audit for any user or service account that currently holds them. For detection, alert on DRSUAPI replication sourced from a host that is not a DC (Event ID 4662 with the replication GUIDs, correlated to source IP).</p>
<p><strong>References</strong></p><ul><li>MITRE ATT&amp;CK T1003.006: OS Credential Dumping, DCSync</li><li>CWE-522: Insufficiently Protected Credentials</li><li>Microsoft: Reset the krbtgt account password</li></ul>
"""

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pastel{% endblock %}</title>
<style>
body{font-family:sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#24292f}
nav{margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:1px solid #d0d7de}
nav a{font-weight:600;color:#0969da;text-decoration:none}
h1{margin-top:0}
pre{white-space:pre-wrap;word-break:break-word;background:#f6f8fa;padding:1rem;border-radius:6px;border:1px solid #d0d7de;font-size:.9em}
textarea{width:100%;min-height:200px;font-family:monospace;font-size:.9em;padding:.5rem;border:1px solid #d0d7de;border-radius:6px;box-sizing:border-box}
input[type=text],input[type=password],input[type=number]{padding:.4rem .6rem;border:1px solid #d0d7de;border-radius:6px}
select{padding:.4rem .6rem;border:1px solid #d0d7de;border-radius:6px}
button,input[type=submit]{padding:.4rem .9rem;background:#0969da;color:#fff;border:none;border-radius:6px;cursor:pointer}
button:hover{background:#0860ca}
.flash-notice{color:#1a7f37;margin:.5rem 0}
.flash-error{color:#d1242f;margin:.5rem 0}
.meta{color:#57606a;font-size:.85em}
.icon-lock{color:#57606a}
fieldset{border:1px solid #d0d7de;border-radius:6px;padding:.75rem 1rem;margin:.75rem 0}
legend{font-weight:600;padding:0 .4rem}
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('pastel.index') }}">📋 Pastel</a>
</nav>
{% block pastel_content %}{% endblock %}
</body>
</html>

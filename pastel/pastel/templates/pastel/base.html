<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PASTEL{% endblock %}</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#0a0f14;color:#dfe9f0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  a{color:#37c9d6}
  .px-appbar{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid #1c2a35;background:#0e151c}
  .px-appbar .brand{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#3ad29a}
  .px-appbar .brand a{color:inherit;text-decoration:none}
  /* CodeMirror dark theme to match the app (the default theme is bright white). */
  .CodeMirror{background:#07100f;color:#dfe9f0}
  .CodeMirror-gutters{background:#0e151c;border-right:1px solid #16313b}
  .CodeMirror-linenumber{color:#5a6b78}
  .CodeMirror-cursor{border-left:1px solid #9fe9d7}
  .CodeMirror-selected{background:#1c2a35}
  .CodeMirror-activeline-background{background:#0e151c}
  .cm-s-default .cm-header{color:#9fe9d7}
  .cm-s-default .cm-quote{color:#8aa0b0}
  .cm-s-default .cm-link,.cm-s-default .cm-url{color:#37c9d6}
  .cm-s-default .cm-comment,.cm-s-default .cm-meta{color:#5a6b78}
  .cm-s-default .cm-string{color:#3ad29a}
  .cm-s-default .cm-variable-2{color:#9fe9d7}
</style>
{% block head_extra %}{% endblock %}
</head>
<body>
  <div class="px-appbar">
    <span class="brand"><a href="{{ url_for('pastel.index') }}">$ PASTEL</a></span>
    <span>{% block appbar_title %}{% endblock %}</span>
  </div>
  {% block content %}{% endblock %}
{% block body_extra %}{% endblock %}
</body>
</html>

[project]
name = "registrar"
version = "0.1.0.dev0"
description = "Registrar — offensive-security infrastructure inventory + control for lotek. Servers, domains, DNS, provider-agnostic (driver backends). Mountable into lotek or run standalone."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0.0",
    "flask-wtf>=1.2.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyrefly>=0.16.0",
]
# Real provider backends (opt-in): libcloud for compute+DNS, twilio for SMS. The MVP ships in-memory
# `null` backends so the gate/audit machinery runs with no egress or credentials.
providers = ["apache-libcloud>=3.8", "twilio>=9.0"]

# Discovery signal: lotek enumerates installed extensions via this entry-point group
# (importlib.metadata.entry_points(group="lotek.extensions")). The value is the entrypoint MODULE that
# exposes register(...); ep.name is the slug and ep.load() imports that module.
[project.entry-points."lotek.extensions"]
registrar = "registrar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["registrar"]

# Ship lotek-extension.toml INSIDE the wheel's package dir so the host can read the mount/nav/host/db
# manifest from the installed package via
# importlib.resources.files("registrar").joinpath("lotek-extension.toml"). The manifest lives at the
# project root (where lotek's vendoring consumes it verbatim); force-include copies it under the
# package dir in the built wheel without moving or duplicating the source file in the repo.
[tool.hatch.build.targets.wheel.force-include]
"lotek-extension.toml" = "registrar/lotek-extension.toml"

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

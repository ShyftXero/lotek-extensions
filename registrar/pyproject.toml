[project]
name = "registrar"
version = "0.1.0.dev0"
description = "Registrar — offensive-security infrastructure inventory + control for lotek. Servers, domains, DNS, provider-agnostic (driver backends). Mountable into lotek or run standalone."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0.0",
    "flask-wtf>=1.2.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pyrefly>=0.16.0",
]
# Real provider backends (opt-in): libcloud for compute+DNS, twilio for SMS. The MVP ships in-memory
# `null` backends so the gate/audit machinery runs with no egress or credentials.
providers = ["apache-libcloud>=3.8", "twilio>=9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["registrar"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
<title>{% block title %}Vector{% endblock %}</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#0a0f14;color:#dfe9f0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  a{color:#37c9d6}
  .vec-shell{min-height:100vh;display:flex;flex-direction:column}
  .vec-appbar{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid #1c2a35;background:#0e151c}
  .vec-appbar .brand{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#ff4d5e}
  .vec-appbar .brand a{color:inherit;text-decoration:none}
  .vec-appbar .spacer{flex:1}
  .vec-appbar .actions{display:flex;gap:8px;align-items:center}
  .vec-main{flex:1;min-height:0;display:flex;flex-direction:column}
</style>
{% block head_extra %}{% endblock %}
</head>
<body>
<div class="vec-shell">
  <div class="vec-appbar">
    <span class="brand"><a href="{{ url_for('vector.dashboard') }}">◭ Vector</a></span>
    <span>{% block appbar_title %}{% endblock %}</span>
    <span class="spacer"></span>
    <span class="actions">{% block appbar_actions %}{% endblock %}</span>
  </div>
  <div class="vec-main">
    {% block content %}{% endblock %}
  </div>
</div>
{% block body_extra %}{% endblock %}
</body>
</html>

# Claims about the bundled lotek walkthrough (lotek-walkthrough.json), one per tour step.
#
# Format: lotek core docs/DOC_CLAIMS.md, "Extension claims sidecars (TOML)" — only [[claim]] tables with
# the keys id / describes / anchors. Each step restates claims from lotek's docs/DATAFLOW.md, so its
# anchors are copied VERBATIM from those DATAFLOW claims (named in the comment above each entry). When the
# code under a DATAFLOW claim moves, core's doc-claims guard fails on this sidecar too, and the tour step
# that says the same thing is flagged for a rewrite.

# Step 1 — restates DOC-DATAFLOW-09, DOC-DATAFLOW-10
[[claim]]
id = "DOC-VECTOR-TOUR-01"
describes = "lotek-walkthrough.json"
anchors = [
    "sym=app.routes.runner_api.runner_key_exchange",
    "test=tests/test_e2e_channel_http.py::test_key_exchange_registers_key_and_returns_dashboard_key",
    "test=tests/test_runner_cred_authz.py::test_key_exchange_rekey_requires_registration_secret",
    "sym=app.routes.runner_api.runner_heartbeat",
    "test=tests/test_e2e_channel_http.py::test_encrypted_heartbeat_round_trips",
    "test=tests/test_e2e_channel_http.py::test_plaintext_heartbeat_is_refused",
    "test=tests/test_runner_capability_gate.py::test_heartbeat_persists_reported_tools_and_image",
]


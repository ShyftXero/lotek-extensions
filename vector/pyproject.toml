[project]
name = "vector"
version = "0.1.0.dev0"
description = "Attack-path visualization: author interactive kill-chain diagrams in the browser and export a self-contained HTML deliverable. Mountable into Lotek or run standalone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-wtf>=1.2.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.6.0",
    "pyrefly>=0.16.0",
]

[project.scripts]
vector = "vector.standalone:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vector"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# seed.py is a declarative data port of the reference deliverable — long string literals (blue-team
# queries/findings) are inherent to the content, not a style problem.
"vector/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

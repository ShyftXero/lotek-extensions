    { name = "pytest-playwright", marker = "extra == 'dev'", specifier = ">=0.4.0" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.6.0" },
    { name = "sqlalchemy", specifier = ">=2.0.0" },
]
provides-extras = ["dev"]


# How this extension MOUNTS into a host (lotek). These are the values lotek's
# scripts/stage-extension.sh currently GENERATES into its own [extension] table (passed as CLI args at
# vendor time). Carried here so an INSTALLED package (pinned git dep) is self-describing: the host can
# read its mount metadata straight from the shipped manifest instead of the operator re-supplying
# entrypoint/url_prefix/seed. Named [mount], NOT [extension], on purpose — the staging script still
# emits its own [extension] table before appending this file, and TOML forbids a duplicate table, so
# an [extension] header here would make tomllib raise and silently un-discover the whole extension.
[mount]
name = "vector"
entrypoint = "vector"          # importable module exposing register(...)
url_prefix = "/vector"
seed = "vector.seed:seed_defaults"   # module:callable run once after register() (idempotent)

# What Vector exposes to a host (e.g. lotek). Consumed at vendor time by the host's
# scripts/stage-extension.sh and appended verbatim to the generated extensions/vector/extension.toml,
# so the host renders exactly the sidebar entries declared here. `path` is relative to the extension's
# url_prefix; `icon` is an optional glyph. Order here is the sidebar order.
#
# ONE sidebar entry only. The `/` (list) and `/diagrams` routes render the SAME view
# (blueprint.dashboard carries both decorators), so a second "Attack Paths" nav link was a duplicate
# of this one — it pointed operators at the identical page. `/diagrams` remains a live route (for
# existing links/bookmarks); it just no longer gets its own sidebar entry.
[[nav]]
label = "Vector"
path = "/"
icon = "◭"

# Tables this extension OWNS (see the equivalent block in Scribble): the host may carry them through a
# database migration, attribute them for drop/truncate, and never touch a table nobody claims.
[db]
base = "vector.models:Base"   # the module whose IMPORT registers the tables (db.py alone yields an empty Base)
table_prefix = "vector_"
